name: Build and test

on:
    # Only on pushes to master
    push:
        branches:
            - master
        tags:
    # Build pull requests
    pull_request:

jobs:
    test:
        strategy:
            matrix:
                py:
                    - "3.10"
                    - "3.11"
                    - "3.12"
                    - "3.13"
                os:
                    - "ubuntu-latest"
                architecture:
                    - x64

        name: "Python: ${{ matrix.py }}-${{ matrix.architecture }} on ${{ matrix.os }}"
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v2
            - name: Setup python
              uses: actions/setup-python@v2
              with:
                  python-version: ${{ matrix.py }}
                  architecture: ${{ matrix.architecture }}
            - run: pip install tox
            - name: Running tox
              run: tox -e py
    coverage:
        runs-on: ubuntu-latest
        name: Validate coverage
        steps:
            - uses: actions/checkout@v2
            - name: Setup python 3.9
              uses: actions/setup-python@v2
              with:
                  python-version: 3.9
                  architecture: x64

            - run: pip install tox
            - run: tox -e py27,py39,coverage
